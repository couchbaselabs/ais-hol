# fly.toml — AIS HOL
# Deploy with: fly launch --no-deploy, then fly secrets set ..., then fly deploy
# Docs: https://fly.io/docs/reference/configuration/

app = "ais-hol"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  INFERENCE_MODEL  = "gpt-4o-mini"
  EMBEDDING_MODEL  = "text-embedding-3-small"
  COUCHBASE_BUCKET_NAME            = "shared"
  COUCHBASE_SEARCH_INDEX_NAME      = "documentation"
  COUCHBASE_CONVERSATION_SCOPE     = "_default"
  COUCHBASE_CONVERSATION_COLLECTION = "conversations"
  CACHE_BUCKET     = "cache"
  CACHE_SCOPE      = "_default"
  CACHE_COLLECTION = "semantic"
  CACHE_INDEX      = "semantic_cache_vector_idx"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 20
    hard_limit = 25

# Free tier: shared-cpu-1x, 512 MB RAM
# 256 MB is too small for sentence-transformers + couchbase SDK at runtime.
[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
