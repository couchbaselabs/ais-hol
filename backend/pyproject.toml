#################################################
# Project metadata
#################################################

[project]
name = "chatbot"
version = "0.1.0"
description = "A chatbot workshop."
readme = "README.md"
keywords = ["rag", "ai", "tools", "agents"]
authors = [{name = "Laurent Doguin", email = "laurent.doguin@couchbase.com"},{name = "Shivay Lamba", email = "shivay.lamba@couchbase.com"}]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "python-multipart>=0.0.9",
    "couchbase<=4.5.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "agentc[langgraph]>=0.4.0",
    "agentc-langchain>=0.4.0",
    "extra-platforms<9.0.0",
    "sentence-transformers (>=5.3.0,<6.0.0)",
    "gitignore-parser (>=0.1.13,<0.2.0)",
    "click-extra>=4.15.0"
]

[project.urls]
Repository = "https://github.com/couchbaselabs/ais-hol.git"


